<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码生成器 - 在线生成安全随机密码</title>
    <meta name="description" content="免费在线密码生成器，自定义长度和字符类型，生成安全的随机密码。">
    <meta name="keywords" content="密码生成器,随机密码,安全密码,password generator,在线密码生成">
    <link rel="canonical" href="https://shaomingxin72-dev.github.io/typing-test/tools/password-generator.html">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="site-header">
        <h1>密码生成器</h1>
        <p>生成安全的随机密码</p>
    </header>

    <div class="tool-page">
        <div class="breadcrumb"><a href="../index.html">首页</a> / 密码生成器</div>

        <div class="section">
            <label>密码长度: <span id="len-display">16</span></label>
            <input type="range" id="length" min="4" max="64" value="16" oninput="document.getElementById('len-display').textContent=this.value" style="width:100%;accent-color:#3a7bd5;">
        </div>

        <div class="section" style="display:flex;gap:20px;flex-wrap:wrap;">
            <label><input type="checkbox" id="upper" checked> 大写字母 (A-Z)</label>
            <label><input type="checkbox" id="lower" checked> 小写字母 (a-z)</label>
            <label><input type="checkbox" id="digits" checked> 数字 (0-9)</label>
            <label><input type="checkbox" id="symbols" checked> 特殊字符 (!@#$...)</label>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="generate()">生成密码</button>
            <button class="btn btn-secondary" onclick="copyResult()">复制密码</button>
        </div>

        <div class="section">
            <div class="result-box" id="output" style="font-size:1.4rem;text-align:center;letter-spacing:2px;min-height:80px;display:flex;align-items:center;justify-content:center;">
                <span id="output-text">点击"生成密码"</span>
            </div>
        </div>

        <div id="strength" style="margin-top:12px;text-align:center;font-size:0.9rem;"></div>
    </div>

    <div class="ad-container">
        <div class="ad-placeholder">广告位</div>
    </div>

    <footer class="site-footer">
        <p><a href="../index.html">返回工具箱</a> | 在线工具箱 &copy; 2026</p>
    </footer>

    <script>
        function generate() {
            const len = parseInt(document.getElementById('length').value);
            let chars = '';
            if (document.getElementById('upper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (document.getElementById('lower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (document.getElementById('digits').checked) chars += '0123456789';
            if (document.getElementById('symbols').checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            if (!chars) { alert('请至少选择一种字符类型'); return; }

            let password = '';
            const arr = new Uint32Array(len);
            crypto.getRandomValues(arr);
            for (let i = 0; i < len; i++) {
                password += chars[arr[i] % chars.length];
            }

            document.getElementById('output-text').textContent = password;
            showStrength(password);
        }

        function showStrength(pwd) {
            let score = 0;
            if (pwd.length >= 8) score++;
            if (pwd.length >= 16) score++;
            if (/[A-Z]/.test(pwd)) score++;
            if (/[a-z]/.test(pwd)) score++;
            if (/[0-9]/.test(pwd)) score++;
            if (/[^A-Za-z0-9]/.test(pwd)) score++;

            const levels = ['很弱', '弱', '一般', '较强', '强', '很强'];
            const colors = ['#f87171', '#fb923c', '#fbbf24', '#a3e635', '#4ade80', '#22d3ee'];
            const idx = Math.min(score - 1, 5);
            document.getElementById('strength').innerHTML =
                '密码强度: <span style="color:' + colors[idx] + ';font-weight:bold;">' + levels[idx] + '</span>';
        }

        function copyResult() {
            const text = document.getElementById('output-text').textContent;
            if (text && text !== '点击"生成密码"') {
                navigator.clipboard.writeText(text);
                showToast('已复制到剪贴板');
            }
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast show';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 2000);
        }

        generate();
    </script>
</body>
</html>
