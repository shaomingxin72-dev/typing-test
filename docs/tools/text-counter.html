<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字数统计工具 - 在线统计字数字符数行数</title>
    <meta name="description" content="免费在线字数统计工具，实时统计中英文字数、字符数、行数、段落数。">
    <meta name="keywords" content="字数统计,字符统计,在线字数,word count,字数统计工具">
    <link rel="canonical" href="https://shaomingxin72-dev.github.io/typing-test/tools/text-counter.html">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="site-header">
        <h1>字数统计</h1>
        <p>实时统计字数、字符数、行数</p>
    </header>

    <div class="tool-page">
        <div class="breadcrumb"><a href="../index.html">首页</a> / 字数统计</div>

        <div class="section">
            <label for="input">输入或粘贴文本</label>
            <textarea id="input" placeholder="在这里输入或粘贴文本..." rows="8" oninput="count()"></textarea>
        </div>

        <div class="stats-bar" style="margin-top:20px;">
            <div class="stat">
                <div class="value" id="chars">0</div>
                <div class="label">字符数</div>
            </div>
            <div class="stat">
                <div class="value" id="chars-no-space">0</div>
                <div class="label">不含空格</div>
            </div>
            <div class="stat">
                <div class="value" id="words">0</div>
                <div class="label">单词数</div>
            </div>
            <div class="stat">
                <div class="value" id="lines">0</div>
                <div class="label">行数</div>
            </div>
            <div class="stat">
                <div class="value" id="cn-chars">0</div>
                <div class="label">中文字符</div>
            </div>
        </div>
    </div>

    <div class="ad-container">
        <div class="ad-placeholder">广告位</div>
    </div>

    <footer class="site-footer">
        <p><a href="../index.html">返回工具箱</a> | 在线工具箱 &copy; 2026</p>
    </footer>

    <script>
        function count() {
            const text = document.getElementById('input').value;
            document.getElementById('chars').textContent = text.length;
            document.getElementById('chars-no-space').textContent = text.replace(/\s/g, '').length;
            document.getElementById('words').textContent = text.trim() ? text.trim().split(/\s+/).length : 0;
            document.getElementById('lines').textContent = text ? text.split('\n').length : 0;
            document.getElementById('cn-chars').textContent = (text.match(/[一-龥]/g) || []).length;
        }
    </script>
</body>
</html>
