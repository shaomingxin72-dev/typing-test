<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成器 - 在线免费生成二维码</title>
    <meta name="description" content="免费在线二维码生成器，将文本、网址、电话等信息转为二维码图片，支持下载PNG格式。">
    <meta name="keywords" content="二维码生成器,QR码生成,在线二维码,qrcode generator,免费二维码">
    <link rel="canonical" href="https://shaomingxin72-dev.github.io/typing-test/tools/qr-generator.html">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="site-header">
        <h1>二维码生成器</h1>
        <p>将文本、网址转为二维码图片</p>
    </header>

    <div class="tool-page">
        <div class="breadcrumb"><a href="../index.html">首页</a> / 二维码生成器</div>

        <div class="section">
            <label for="input">输入文本或网址</label>
            <textarea id="input" placeholder="输入文本、网址、电话号码等..." rows="3">https://shaomingxin72-dev.github.io/typing-test</textarea>
        </div>

        <div class="section" style="display:flex;gap:20px;flex-wrap:wrap;">
            <div>
                <label>尺寸</label>
                <select id="size" onchange="generateQR()">
                    <option value="200">200x200</option>
                    <option value="300" selected>300x300</option>
                    <option value="400">400x400</option>
                    <option value="500">500x500</option>
                </select>
            </div>
            <div>
                <label>前景色</label>
                <input type="color" id="fg-color" value="#000000" onchange="generateQR()" style="width:60px;height:38px;">
            </div>
            <div>
                <label>背景色</label>
                <input type="color" id="bg-color" value="#ffffff" onchange="generateQR()" style="width:60px;height:38px;">
            </div>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="generateQR()">生成二维码</button>
            <button class="btn btn-secondary" onclick="downloadQR()">下载 PNG</button>
        </div>

        <div class="section" style="text-align:center;margin-top:20px;">
            <canvas id="qr-canvas" style="border-radius:12px;max-width:100%;"></canvas>
            <p id="placeholder" style="color:#555;margin-top:20px;">输入内容后点击"生成二维码"</p>
        </div>
    </div>

    <div class="ad-container">
        <div class="ad-placeholder">广告位</div>
    </div>

    <footer class="site-footer">
        <p><a href="../index.html">返回工具箱</a> | 在线工具箱 &copy; 2026</p>
    </footer>

    <!-- QR Code library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script>
        function generateQR() {
            const text = document.getElementById('input').value.trim();
            if (!text) { alert('请输入内容'); return; }

            const size = parseInt(document.getElementById('size').value);
            const fgColor = document.getElementById('fg-color').value;
            const bgColor = document.getElementById('bg-color').value;

            // Create QR code
            const qr = qrcode(0, 'M');
            qr.addData(text);
            qr.make();

            const canvas = document.getElementById('qr-canvas');
            const ctx = canvas.getContext('2d');
            const modules = qr.getModuleCount();
            const cellSize = Math.floor(size / modules);
            const canvasSize = cellSize * modules + 20; // padding

            canvas.width = canvasSize;
            canvas.height = canvasSize;
            document.getElementById('placeholder').style.display = 'none';

            // Draw background
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvasSize, canvasSize);

            // Draw QR modules
            ctx.fillStyle = fgColor;
            for (let row = 0; row < modules; row++) {
                for (let col = 0; col < modules; col++) {
                    if (qr.isDark(row, col)) {
                        ctx.fillRect(
                            col * cellSize + 10,
                            row * cellSize + 10,
                            cellSize,
                            cellSize
                        );
                    }
                }
            }
        }

        function downloadQR() {
            const canvas = document.getElementById('qr-canvas');
            if (canvas.width <= 1) { alert('请先生成二维码'); return; }
            const link = document.createElement('a');
            link.download = 'qrcode.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Generate on load
        generateQR();
    </script>
</body>
</html>
